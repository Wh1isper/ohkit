name: Release ohkit

on:
  push:
    tags:
      - "release/ohkit-v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: release-ohkit
  cancel-in-progress: false
  queue: max

jobs:
  build:
    name: Build ohkit distributions
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Prepare release version
        id: version
        run: |
          version="${GITHUB_REF_NAME#release/ohkit-v}"
          python scripts/prepare-release-version.py ohkit "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Build ohkit Python distributions
        run: |
          uv lock --check
          uv build
          uv run --locked python scripts/check_distribution.py

      - name: Verify ohkit artifact scope
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python -c 'from scripts.release_version import python_package_version; import os, tomllib; assert tomllib.load(open("pyproject.toml", "rb"))["project"]["version"] == python_package_version(os.environ["VERSION"])'
          python_version="${VERSION/-rc./rc}"
          test -f "dist/ohkit-${python_version}-py3-none-any.whl"
          test -f "dist/ohkit-${python_version}.tar.gz"
          test "$(find dist -maxdepth 1 -type f \( -name '*.whl' -o -name '*.tar.gz' \) | wc -l)" -eq 2

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: ohkit-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish ohkit to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: ohkit-pypi
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: ohkit-dist
          path: dist

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: false

      - name: Publish package
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: uv publish --check-url https://pypi.org/simple/ dist/*

  create-release:
    name: Create GitHub Release
    needs: [build, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout release tag and history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: ohkit-dist
          path: dist

      - name: Create release with channel-scoped notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.build.outputs.version }}
        run: >-
          python3 scripts/create-github-release.py ohkit "$VERSION"
          "ohkit $VERSION" dist/*
