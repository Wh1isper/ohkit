site_name: ohkit
site_description: An independent Python programming interface for agent harnesses.
site_url: https://ohkit.wh1isper.top/
site_author: Wh1isper
repo_name: Wh1isper/ohkit
repo_url: https://github.com/Wh1isper/ohkit
edit_uri: blob/main/docs/
strict: true

nav:
  - Overview: index.md
  - Getting started: getting-started.md
  - Design examples:
      - Application-hosted executor: examples/application-hosted-executor.md
  - Maintainers:
      - Documentation: documentation.md
      - Releasing: releasing.md

theme:
  name: material
  font: false
  features:
    - navigation.footer
    - content.code.copy
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  nav:
    omitted_files: warn
  links:
    anchors: warn
    unrecognized_links: warn
