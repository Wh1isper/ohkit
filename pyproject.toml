[project]
name = "ohkit"
version = "0.0.0"
description = "A unified Python API for coding agents."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Converge AI Labs" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/converge-ai-labs/ohkit"
Repository = "https://github.com/converge-ai-labs/ohkit"
Issues = "https://github.com/converge-ai-labs/ohkit/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ohkit"]

[tool.hatch.build.targets.sdist]
only-include = ["ohkit", "pyproject.toml", "README.md", "LICENSE"]

[dependency-groups]
dev = [
    "deptry>=0.25,<0.26",
    "mdformat==1.0.0",
    "mdformat-footnote==0.1.3",
    "mdformat-front-matters==2.0.0",
    "mdformat-gfm==1.0.0",
    "mdformat-gfm-alerts==2.1.0",
    "pre-commit>=4.3,<5",
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "pytest-timeout>=2.4,<3",
    "pytest-xdist>=3.8,<4",
    "pyyaml>=6,<7",
    "ruff>=0.16,<0.17",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
ignore = ["E501"]

[tool.pyright]
include = ["ohkit", "scripts"]
exclude = ["**/tests", "**/__pycache__", ".venv"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
reportTypedDictNotRequiredAccess = false

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests", "scripts/tests"]
timeout = 120
junit_logging = "all"
junit_log_passing_tests = false
filterwarnings = [
    "error::pytest.PytestUnhandledThreadExceptionWarning",
    "error::pytest.PytestUnraisableExceptionWarning",
]

[tool.deptry]
known_first_party = ["ohkit"]
extend_exclude = ["scripts"]
